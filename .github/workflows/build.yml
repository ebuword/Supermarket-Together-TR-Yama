name: Windows installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name "Supermarket_Together_TR_Yama_v12.27.4-fixed.1" `
            --icon "installer/assets/game_icon.ico" `
            --version-file "installer/version_info.txt" `
            --add-data "installer/mod_data;mod_data" `
            "installer/setup_installer.py"
      - uses: actions/upload-artifact@v4
        with:
          name: Supermarket-Together-TR-Yama-v12.27.4-fixed.1
          path: dist/*.exe
